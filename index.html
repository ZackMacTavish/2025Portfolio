<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Strip trailing slashes BEFORE React boots. GitHub Pages serves directory
      URLs (e.g. /Microsoft/) but react-router v7 strict-matches paths defined
      without a slash (`<Route path="/Microsoft">`). Without this, `/Microsoft/`
      falls through to the catch-all and redirects to `/`.
    -->
    <script type="text/javascript">
      (function () {
        var p = window.location.pathname;
        if (p.length > 1 && p.charAt(p.length - 1) === '/') {
          window.history.replaceState(
            null,
            '',
            p.slice(0, -1) + window.location.search + window.location.hash
          );
        }
      })();
    </script>

    <!--
      GitHub Pages SPA path restore: 404.html bounces deep links to "/?/<path>".
      This script rewrites the URL back into the real path BEFORE React boots,
      so react-router and any preload hints see the intended route.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Preload the primary font subset so text paints without waiting on CSS parse -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/SpaceGrotesk-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Lora-latin.woff2" crossorigin />

    <!--
      Prerender flash guard:
      The root route is prerendered with the LandingPage DOM baked in (for SEO),
      but styled-components v6 injects its CSS via CSSOM at runtime — it is NOT
      present in the static HTML. That means on first paint the Nav logo SVG
      (no intrinsic width/height) and other elements render huge/unstyled for
      a moment before React hydrates and the IntroAnimation overlay mounts.

      To avoid this, we hide #root and show a plain white screen until React
      has rendered. main.jsx removes the `app-hydrating` class on <html> after
      the first paint, at which point the IntroAnimation overlay (root route)
      or IntroGate overlay (deep-link first visit) takes over.

      We apply this on every route because every prerendered page suffers the
      same styled-components-injects-at-runtime FOUC — not just `/`. The
      guard is removed after two RAFs in main.jsx, so the cost is minimal.
    -->
    <style>
      html.app-hydrating #root { visibility: hidden; }
      html.app-hydrating::before {
        content: '';
        position: fixed;
        inset: 0;
        background: #ffffff;
        z-index: 2147483647;
      }
      html[data-theme='dark'].app-hydrating::before { background: #000000; }
    </style>
    <script>
      (function () {
        var theme = 'light';
        try {
          var storedTheme = localStorage.getItem('zm-theme-preference');
          if (storedTheme === 'light' || storedTheme === 'dark') {
            theme = storedTheme;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (error) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        document.documentElement.classList.add('app-hydrating');
      })();
    </script>

  <meta name="description" content="Explore the portfolio of Zack MacTavish, a multidisciplinary designer specializing in art direction, branding, UX/UI, and visual storytelling for digital and print. View selected projects, case studies, and creative work." />

  <!-- Theme color for Android Chrome / in-app browsers -->
  <meta name="theme-color" content="#000000" />
  <script>
    (function () {
      var theme = "light";
      try {
        var storedTheme = localStorage.getItem("zm-theme-preference");
        if (storedTheme === "light" || storedTheme === "dark") {
          theme = storedTheme;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      } catch (error) {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content =
        theme === "dark" ? "#353A32" : "#E3E4D8";
    })();
  </script>
  <meta name="author" content="Zack MacTavish" />
