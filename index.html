<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      GitHub Pages SPA path restore: 404.html bounces deep links to "/?/<path>".
      This script rewrites the URL back into the real path BEFORE React boots,
      so react-router and any preload hints see the intended route.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Preload the primary font subset so text paints without waiting on CSS parse -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/SpaceGrotesk-latin.woff2" crossorigin />

  <meta name="description" content="Explore the portfolio of Zack MacTavish, a multidisciplinary designer specializing in art direction, branding, UX/UI, and visual storytelling for digital and print. View selected projects, case studies, and creative work." />
  <!-- Canonical URL for non-JS crawlers; runtime SEO component will update this per route -->
  <link rel="canonical" href="https://mactavish.xyz/" />
    
  <!-- Favicon: prefer the modern PNG (32x32) for crisp rendering; keep ICO as a legacy fallback.
    Note: you manually edited /public/favicon.ico — the generator script will not run automatically
    so your manual ico will be preserved unless you run `npm run make-favicon`. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/og/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/og/favicon-16.png" />

  <!-- Static OG image for social bots (guaranteed fallback) -->
  <meta property="og:site_name" content="Zack MacTavish — Portfolio" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://mactavish.xyz/assets/og/website-logoresolutions-1200x630.png" />
