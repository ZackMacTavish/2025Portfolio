<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zack MacTavish – Portfolio</title>
    <!--
      GitHub Pages SPA fallback (Rafael Pedicini, MIT).
      When GH Pages can't find a path, it serves this 404.html. We rewrite the
      URL into a single redirect query string and bounce to "/" — index.html
      then restores the path via history.replaceState before React boots so
      react-router sees the intended path.
      pathSegmentsToKeep = 0 for an apex/custom-domain site.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
